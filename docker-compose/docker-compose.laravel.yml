version: '3'

services:
  appserver-stage:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.mssql
      args:
        ENV_FILE: .env
    image: atlas-backend-appserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://webserver-stage/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache

  webserver-stage:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.staging
    image: atlas-backend-webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8000:80"
    depends_on:
      - appserver-stage
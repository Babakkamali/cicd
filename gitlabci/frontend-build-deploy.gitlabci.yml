build_staging:
  stage: build
  image: docker:stable
  only:
    - develop
  retry: 
    max: 2
  script:
    - 'docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}'
    - 'docker build -t ${appserver_image} --build-arg ENV_FILE=.env.staging .'
    - 'docker push ${appserver_image}'
  tags:
    - docker-runner-tag
  environment:
    name: staging

build_production:
  stage: build
  image: docker:stable
  only:
    - main
  retry: 
    max: 2
  script:
    - 'docker login -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} ${CI_REGISTRY}'
    - 'docker build -t ${appserver_image} --build-arg ENV_FILE=.env.prod .'
    - 'docker push ${appserver_image}'
  tags:
    - docker-runner-tag
  environment:
    name: production

deploy_staging:
  stage: deploy
  script:
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER "mkdir -p ${dockercompose_path_staging} 2> /dev/null"
    - scp -o StrictHostKeyChecking=no docker-compose.staging.yml $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER:${dockercompose_path_staging}/docker-compose.yml
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER2 "docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} && docker pull ${appserver_image}"
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER "docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} && docker pull ${appserver_image} && cd ${dockercompose_path_staging} && IMAGE_NAME=${appserver_image} docker stack deploy --with-registry-auth --compose-file docker-compose.yml ${stack_name_staging}" 
  tags:
    - shell-runner-tag
  only:
    - develop
  environment:
    name: staging 
    url: https://stage.babakkamali.com

deploy_main:
  stage: deploy
  script:
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER "mkdir -p ${dockercompose_path} 2> /dev/null"
    - scp -o StrictHostKeyChecking=no docker-compose.prod.yml $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER:${dockercompose_path}/docker-compose.yml
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER2 "docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} && docker pull ${appserver_image}"
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER "docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} -p ${CI_JOB_TOKEN} && docker pull ${appserver_image} && cd ${dockercompose_path} && IMAGE_NAME=${appserver_image} docker stack deploy --with-registry-auth --compose-file docker-compose.yml ${stack_name}" 
  tags:
    - shell-runner-tag
  only:
    - main
  allow_failure: false
  environment:
    name: production
    url: https://prod.babakkamali.com
  when: manual

healthcheck_staging:
  stage: health
  variables:
    TIMEOUT: "150"
    INTERVAL: "5"
    SERVICE_NAME: "appserver"
  script:
    - scp -o StrictHostKeyChecking=no healthcheck.sh $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER:${dockercompose_path_staging}/healthcheck.sh
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER "bash ${dockercompose_path_staging}/healthcheck.sh $TIMEOUT $INTERVAL '${stack_name_staging}_$SERVICE_NAME' '${appserver_image}'"
  tags:
    - shell-runner-tag
  only:
    - develop
  environment:
    name: staging
    url: https://stage.babakkamali.com

healthcheck_prod:
  stage: health
  variables:
    TIMEOUT: "150"
    INTERVAL: "5"
    SERVICE_NAME: "appserver"
  script:
    - scp -o StrictHostKeyChecking=no healthcheck.sh $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER:${dockercompose_path_staging}/healthcheck.sh
    - ssh -o StrictHostKeyChecking=no $SWARM_DEPLOY_USER@$SWARM_DEPLOY_SERVER "bash ${dockercompose_path}/healthcheck.sh $TIMEOUT $INTERVAL '${stack_name}_$SERVICE_NAME' '${appserver_image}'"
  tags:
  - shell-runner-tag
  only:
    - main
  needs:
    - job: deploy_main
      optional: false
  allow_failure: false
  environment:
    name: production
    url: https://prod.babakkamali.com
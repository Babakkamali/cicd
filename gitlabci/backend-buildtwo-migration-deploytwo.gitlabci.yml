stages:          # List of stages for jobs, and their order of execution
  # - sonarqube-check
  - build
  - migration
  - deploy
  - health

variables:
  appserver_image: ${CI_REGISTRY}/${CI_PROJECT_PATH}/appserver:$CI_COMMIT_REF_SLUG.${CI_PIPELINE_IID}
  webserver_image: ${CI_REGISTRY}/${CI_PROJECT_PATH}/webserver:$CI_COMMIT_REF_SLUG.${CI_PIPELINE_IID}
  dockercompose_path: /home/gitlabci/projects/projectname
  dockercompose_path_staging: /home/gitlabci/projects/projectname-stage
  stack_name: projectname
  stack_name_staging: projectname-stage

